<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
	<defs>
		<radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
			<stop offset="0%" stop-color="#0e2338"/>
			<stop offset="60%" stop-color="#050a14"/>
			<stop offset="100%" stop-color="#020408"/>
		</radialGradient>
		<linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38bdf8"/>
			<stop offset="100%" stop-color="#0284c7"/>
		</linearGradient>
		<linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#facc15"/>
			<stop offset="100%" stop-color="#ea580c"/>
		</linearGradient>
	</defs>

	<!-- Background -->
	<rect width="1200" height="630" fill="url(#bgGlow)"/>
	<path d="M0,0 L1200,630" stroke="#1e293b" stroke-width="1" opacity="0.15"/>
	<path d="M1200,0 L0,630" stroke="#1e293b" stroke-width="1" opacity="0.15"/>

	<!-- Subtle grid pattern -->
	<g opacity="0.08" stroke="#38bdf8" stroke-width="1">
		<line x1="100" y1="0" x2="100" y2="630"/>
		<line x1="300" y1="0" x2="300" y2="630"/>
		<line x1="500" y1="0" x2="500" y2="630"/>
		<line x1="700" y1="0" x2="700" y2="630"/>
		<line x1="900" y1="0" x2="900" y2="630"/>
		<line x1="1100" y1="0" x2="1100" y2="630"/>
		<line x1="0" y1="150" x2="1200" y2="150"/>
		<line x1="0" y1="315" x2="1200" y2="315"/>
		<line x1="0" y1="480" x2="1200" y2="480"/>
	</g>

	<!-- Top Badges -->
	<rect x="80" y="70" width="340" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
	<circle cx="102" cy="91" r="6" fill="#38bdf8"/>
	<text x="120" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="1">AMAZON DEV HACKATHON 2026</text>

	<rect x="440" y="70" width="220" height="42" rx="21" fill="#141c28" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.5"/>
	<text x="462" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fde047" letter-spacing="1">RING ACCESSIBILITY</text>

	<!-- Main Title -->
	<text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">
		DoorSense
	</text>

	<!-- Subtitle -->
	<text x="80" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#94a3b8">
		Accessible Ring Alerts That Explain What Happened
	</text>

	<!-- Tagline -->
	<text x="80" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b" width="600">
		Deterministic, calm, visual-first guidance for deaf and hard-of-hearing residents.
	</text>

	<!-- Feature chips -->
	<g transform="translate(80, 460)">
		<rect x="0" y="0" width="180" height="50" rx="12" fill="#0c1929" stroke="#38bdf8" stroke-width="1"/>
		<text x="90" y="31" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#bae6fd">Zero Audio Reliance</text>

		<rect x="200" y="0" width="190" height="50" rx="12" fill="#191508" stroke="#eab308" stroke-width="1"/>
		<text x="295" y="31" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#fef08a">WCAG AAA Contrast</text>

		<rect x="410" y="0" width="200" height="50" rx="12" fill="#091b15" stroke="#10b981" stroke-width="1"/>
		<text x="510" y="31" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#a7f3d0">Smart Deduplication</text>

		<rect x="630" y="0" width="170" height="50" rx="12" fill="#180e29" stroke="#a855f7" stroke-width="1"/>
		<text x="715" y="31" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">100% Free Stack</text>
	</g>

	<!-- 3D Ring Graphic Illustration (Right Side) -->
	<g transform="translate(940, 310)">
		<!-- Outer Pulse Wave Rings -->
		<circle cx="0" cy="0" r="190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.25"/>
		<circle cx="0" cy="0" r="150" stroke="#38bdf8" stroke-width="2.5" opacity="0.4"/>
		<circle cx="0" cy="0" r="110" stroke="#facc15" stroke-width="3" stroke-dasharray="12 4" opacity="0.6"/>

		<!-- 3D Ring Device Chassis -->
		<rect x="-65" y="-130" width="130" height="260" rx="36" fill="#1e293b" stroke="#475569" stroke-width="4"/>
		<rect x="-60" y="-125" width="120" height="120" rx="28" fill="#0f172a"/>
		<!-- Camera Lens -->
		<circle cx="0" cy="-65" r="32" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
		<circle cx="0" cy="-65" r="18" fill="#38bdf8" opacity="0.7"/>
		<circle cx="-6" cy="-71" r="5" fill="#ffffff" opacity="0.8"/>
		
		<!-- Glowing Chime Ring Button -->
		<circle cx="0" cy="50" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
		<circle cx="0" cy="50" r="24" fill="#0284c7" opacity="0.9"/>
		<!-- Status LED Ring Light -->
		<circle cx="0" cy="50" r="38" stroke="#facc15" stroke-width="3" stroke-dasharray="16 8"/>
	</g>
</svg>
